<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الاستراتيجية العسكرية 1939</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar Header */
        header {
            background-color: #1f1f1f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }

        .resource-bar {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #2a2a2a;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .resource-val {
            color: #4caf50;
            font-weight: bold;
        }

        /* Main Game Layout */
        main {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* Map Section */
        #map-container {
            flex: 2;
            background-color: #0d1b2a;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .province {
            fill: #2c3e50;
            stroke: #1a252f;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.2s;
        }

        .province:hover {
            fill: #34495e;
        }

        .province.selected {
            fill: #e67e22;
        }

        /* Side Panel */
        #side-panel {
            flex: 1;
            max-width: 350px;
            background-color: #181818;
            border-right: 2px solid #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .panel-card {
            background-color: #242424;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .panel-card h3 {
            color: #e67e22;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <!-- Upper Control Bar -->
    <header>
        <div>
            <h2>الشرق الأوسط 1939</h2>
        </div>
        <div class="resource-bar">
            <div class="resource-item">💰 الميزانية: <span id="res-money" class="resource-val">1000</span></div>
            <div class="resource-item">🛢️ النفط: <span id="res-oil" class="resource-val">500</span></div>
            <div class="resource-item">👥 القوى البشرية: <span id="res-manpower" class="resource-val">15000</span></div>
        </div>
    </header>

    <!-- Main Game View -->
    <main>
        <!-- Map View -->
        <div id="map-container">
            <svg viewBox="0 0 800 600">
                <!-- Interactive Regions Representation -->
                <path id="eg-cairo" class="province" d="M 380,280 L 410,280 L 410,310 L 380,310 Z" onclick="selectProvince('eg-cairo')"></path>
                <text x="385" y="300" fill="#fff" font-size="10">القاهرة</text>

                <path id="eg-alex" class="province" d="M 340,240 L 375,240 L 375,275 L 340,275 Z" onclick="selectProvince('eg-alex')"></path>
                <text x="345" y="260" fill="#fff" font-size="10">الإسكندرية</text>

                <path id="eg-sinai" class="province" d="M 425,260 L 465,260 L 465,300 L 425,300 Z" onclick="selectProvince('eg-sinai')"></path>
                <text x="435" y="283" fill="#fff" font-size="10">سيناء</text>

                <path id="sy-damascus" class="province" d="M 480,180 L 520,180 L 520,220 L 480,220 Z" onclick="selectProvince('sy-damascus')"></path>
                <text x="485" y="203" fill="#fff" font-size="10">دمشق</text>

                <path id="iq-baghdad" class="province" d="M 540,200 L 580,200 L 580,240 L 540,240 Z" onclick="selectProvince('iq-baghdad')"></path>
                <text x="545" y="223" fill="#fff" font-size="10">بغداد</text>
            </svg>
        </div>

        <!-- Information Panel -->
        <div id="side-panel">
            <div class="panel-card">
                <h3 id="prov-name">اختر محافظة من الخريطة</h3>
                <div class="data-row"><span>الدولة:</span> <strong id="prov-country">-</strong></div>
                <div class="data-row"><span>السكان (1939):</span> <strong id="prov-pop">-</strong></div>
                <div class="data-row"><span>المعدات المتوفرة:</span> <strong id="prov-military">-</strong></div>
            </div>

            <div class="panel-card">
                <h3>إدارة القوات والمصانع</h3>
                <button class="btn" onclick="buildFactory()">بناء مصنع جديد (200 💰)</button>
                <button class="btn" onclick="recruiteTroops()">تجنيد فرقة مشاة (100 💰)</button>
            </div>
        </div>
    </main>

    <script>
        // Real Historical Database Setup (1939 Data Sample)
        const database = {
            'eg-cairo': {
                name: 'محافظة القاهرة',
                country: 'مصر',
                population: '1,312,000',
                military: '12,000 جندي - 15 دبابات',
                owner: 'مصر'
            },
            'eg-alex': {
                name: 'محافظة الإسكندرية',
                country: 'مصر',
                population: '685,000',
                military: '8,000 جندي - 4 سفن حربية',
                owner: 'مصر'
            },
            'eg-sinai': {
                name: 'شبه جزيرة سيناء',
                country: 'مصر',
                population: '18,000',
                military: '3,000 جندي',
                owner: 'مصر'
            },
            'sy-damascus': {
                name: 'دمشق',
                country: 'سوريا (الانتداب)',
                population: '290,000',
                military: '5,000 جندي',
                owner: 'سوريا'
            },
            'iq-baghdad': {
                name: 'بغداد',
                country: 'المملكة العراقية',
                population: '400,000',
                military: '10,000 جندي - 8 طائرات',
                owner: 'العراق'
            }
        };

        let selectedProvId = null;
        let money = 1000;

        function selectProvince(id) {
            // Unselect previous
            document.querySelectorAll('.province').forEach(el => el.classList.remove('selected'));
            
            // Select new
            const el = document.getElementById(id);
            if(el) el.classList.add('selected');

            selectedProvId = id;
            const data = database[id];

            if(data) {
                document.getElementById('prov-name').innerText = data.name;
                document.getElementById('prov-country').innerText = data.country;
                document.getElementById('prov-pop').innerText = data.population;
                document.getElementById('prov-military').innerText = data.military;
            }
        }

        function buildFactory() {
            if(money >= 200) {
                money -= 200;
                document.getElementById('res-money').innerText = money;
                alert('تم بناء مصنع جديد بنجاح!');
            } else {
                alert('الميزانية غير كافية!');
            }
        }

        function recruiteTroops() {
            if(money >= 100) {
                money -= 100;
                document.getElementById('res-money').innerText = money;
                alert('تم تجنيد فرقة مشاة جديدة!');
            } else {
                alert('الميزانية غير كافية!');
            }
        }
    </script>
</body>
</html>
